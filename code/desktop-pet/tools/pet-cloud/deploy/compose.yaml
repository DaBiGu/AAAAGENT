services:
  pet-cloud:
    build:
      context: ../../..
      dockerfile: tools/pet-cloud/deploy/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      PET_SOCIAL_HOST: 0.0.0.0
      PET_SOCIAL_MODEL_ENDPOINT: ${PET_SOCIAL_MODEL_ENDPOINT:?configure model endpoint}
      PET_SOCIAL_MODEL: ${PET_SOCIAL_MODEL:?configure model id}
      PET_SOCIAL_API_KEY: ${PET_SOCIAL_API_KEY:?configure dedicated key}
    ports:
      - "127.0.0.1:18766:18766"
    volumes:
      - pet-social-data:/state
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18766/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  pet-social-data:
